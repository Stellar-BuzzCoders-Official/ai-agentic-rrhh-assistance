services:
  joyit-cn-ai-screening-chatbot:
    container_name: joyit-cn-ai-screening-chatbot
    build: .
    ports:
      - "5000:5000"
    networks:
      - joyit_screening_net
    volumes:
      - ./app.py:/app/app.py
      - ./src:/app/src
    environment:
      - CHROMA_SERVER_HOST
      - CHROMA_SERVER_HTTP_PORT
      - FLASK_DEBUG=1
      - FLASK_APP=app.py
      - OLLAMA_BASE_URL
      - OLLAMA_PORT
      - OLLAMA_HOST
      - SCREENSHOT_API_HOST
      - SCREENSHOT_API_PORT
      - API_TEXT_STORAGE_URL
      - API_TEXT_STORAGE_PORT
      - API_TEXT_STORAGE_HOST
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
      - MONGO_SERVER_port
      - MONGO_SERVER_HOST
      - FLAGGER_MODEL
      - AZURE_ENDPOINT
      - AZURE_API_KEY
      - AZURE_DEPLOYMENT
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - GEMINI_URL
    expose:
      - 5000
    
networks:
  joyit_screening_net:
    external: true
