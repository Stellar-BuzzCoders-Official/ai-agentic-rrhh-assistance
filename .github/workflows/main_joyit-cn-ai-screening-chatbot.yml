# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - joyit-cn-ai-screening-chatbot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://joyitcnaiscreeningchatbot.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_75a4abc060de4236a7c83b3fb9542cab }}
        password: ${{ secrets.AzureAppService_ContainerPassword_91884594dd0e44c49640b3ab238732c0 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: joyitcnaiscreeningchatbot.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_75a4abc060de4236a7c83b3fb9542cab }}/joyit-cn-ai-screening-chatbot:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'joyit-cn-ai-screening-chatbot'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_1fd6ceeff1914205981d5c0119511c8d }}
        images: 'joyitcnaiscreeningchatbot.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_75a4abc060de4236a7c83b3fb9542cab }}/joyit-cn-ai-screening-chatbot:${{ github.sha }}'