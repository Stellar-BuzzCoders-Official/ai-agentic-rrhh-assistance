name: Build and Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
      - refactor/langgraph-azure
  workflow_dispatch:

env:
  REGISTRY_SERVER: acrdaiegroup1.azurecr.io
  IMAGE_NAME: rrhh-backend
  AZURE_WEBAPP_NAME: app-rrhh-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push container image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:v0

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy container to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
